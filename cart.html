<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart - Soco.Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Logo</h2>
        <nav class="nav-links"><a href="index.html">Home</a><a href="cart.html">Cart</a></nav>
        <a href="login.html" class="btn btn-outline">Log in</a>
    </header>

    <main>
        <h1 style="margin-bottom: 2rem;">Section 2</h1>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><div style="display: flex; align-items: center; gap: 1rem;"><div class="img-placeholder" style="width: 40px; height: 40px;"></div> Laptop</div></td>
                    <td>$1,299.00</td>
                    <td>1</td>
                    <td>$1,299.00</td>
                </tr>
            </tbody>
        </table>
        
        <div class="cart-totals">
            <span>Total</span>
            <span>12,399.00</span>
            <button class="btn btn-outline">Pay</button>
            <button class="btn" onclick="window.location.href='payment.html'">Add Coupon</button>
        </div>
    </main>

</html>
