<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - Soco.Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Logo</h2>
    </header>

    <main class="auth-container">
        <div class="auth-tabs">
            <a href="signup.html">Sign Up</a>
            <a href="login.html" class="active">Login</a>
        </div>
        
        <h1 style="margin-bottom: 1rem;">Login</h1>
        <p style="margin-bottom: 2rem; color: var(--text-muted);">Lorem ipsum dolor sit amet adipiscing elit.</p>

        <form>
            <div class="input-group" style="text-align: left;">
                <label>Email*</label>
                <input type="email">
            </div>
            <div class="input-group" style="text-align: left;">
                <label>Password*</label>
                <input type="password">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;" onclick="window.location.href='account.html'">Login</button>
            <button type="button" class="btn btn-outline" style="width: 100%; margin-top: 1rem;">Login with Google</button>
        </form>
    </main>
</body>
</html>
