<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - SOCO.Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p class="logo" onclick="window.location.href='index.html'"><span>Soco.</span>Tech</p>
        <nav>
            <a href="index.html#Product">Products</a>
            <a href="index.html">Home</a>
            <a href="index.html#About">About Us</a>
            <a href="index.html#contact">Contact Us</a>
            <a href="cart.html">Cart</a>
        </nav>
        <div class="header-buttons">
            <button class="btn-signup" onclick="window.location.href='signup.html'">Sign Up</button>
        </div>
    </header>

    <main class="form-page">
        <div class="form-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to your SOCO.Tech account</p>
            
            <form action="#" method="POST">
                <table class="form-table">
                    <tr>
                        <td><label for="email">Email Address:</label></td>
                        <td><input type="email" id="email" name="email" placeholder="name@example.com" required></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="password" id="password" name="password" placeholder="••••••••" required></td>
                    </tr>
                    <tr>
                        <!-- colspan="2" makes the button stretch across both columns -->
                        <td colspan="2"><button type="submit" class="full-width-btn">Log In</button></td>
                    </tr>
                </table>
            </form>
            
            <p class="form-footer">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </main>
</body>
</html>
