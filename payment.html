<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment - Soco.Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Logo</h2>
        <nav class="nav-links"><a href="index.html">Home</a><a href="cart.html">Cart</a></nav>
    </header>

    <main class="narrow-container">
        <h1 style="margin-bottom: 1rem;">Payment method</h1>
        <p style="margin-bottom: 2rem; color: var(--text-muted);">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

        <form>
            <div class="input-group">
                <label>Name on invoice</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label>Card number</label>
                <input type="text" placeholder="Placeholder">
            </div>
            <div class="form-row">
                <div class="input-group"><label>Expiry</label><input type="text"></div>
                <div class="input-group"><label>CVV</label><input type="text"></div>
            </div>
            <div class="input-group">
                <label>Email address</label>
                <input type="email" placeholder="email@example.com">
            </div>
            <div class="input-group">
                <label>Country</label>
                <select><option>Select one...</option></select>
            </div>
            <div class="input-group">
                <label>Street address</label>
                <input type="text">
            </div>
            <div class="form-row">
                <div class="input-group"><label>City</label><input type="text"></div>
                <div class="input-group"><label>State / Province</label><input type="text"></div>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                <button type="button" class="btn btn-outline">Cancel</button>
                <button type="button" class="btn-primary">Save</button>
            </div>
        </form>
    </main>
    <!-- Footer Section -->
<footer class="site-footer">

        <!-- Bottom Horizontal Container (Legal Area) -->
        <div class="footer-horizontal-bottom">
            <p>&copy; 2026 Soco.Tech. All rights reserved.</p>
            <div class="footer-legal-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Cookies Settings</a>
            </div>
        </div>
</footer>
</body>
</html>
