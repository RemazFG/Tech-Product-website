<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Name - Soco.Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Logo</h2>
        <nav class="nav-links"><a href="index.html">Home</a><a href="cart.html">Cart</a></nav>
        <a href="login.html" class="btn btn-outline">Log in</a>
    </header>

    <main class="product-detail-layout">
        <div>
            <p>Shop all > Category > Product name</p>
            <h1 style="font-size: 2.5rem; margin: 1rem 0;">Product name</h1>
            <p style="font-size: 1.5rem; font-weight: bold;">$55 <span style="font-size: 1rem; font-weight: normal; color: var(--text-muted);">(3.5 stars) 10 reviews</span></p>
            <p style="margin: 1.5rem 0;">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse varius enim in eros elementum tristique.</p>
            
            <div class="form-row" style="margin-bottom: 1.5rem;">
                <div class="input-group">
                    <label>Variant</label>
                    <select><option>Select</option></select>
                </div>
                <div class="input-group">
                    <label>Qty</label>
                    <input type="number" value="1">
                </div>
            </div>
            
            <button class="btn" style="width: 100%; margin-bottom: 1rem;" onclick="window.location.href='cart.html'">Add To Cart</button>
            <button class="btn btn-outline" style="width: 100%;">Buy Now</button>

            <div class="accordion">Details +</div>
            <div class="accordion">Shipping +</div>
            <div class="accordion">Returns +</div>
        </div>

        <div>
            <div class="img-placeholder main-img">Main Image</div>
            <div class="thumbnail-grid">
                <div class="img-placeholder">1</div>
                <div class="img-placeholder">2</div>
                <div class="img-placeholder">3</div>
                <div class="img-placeholder">4</div>
                <div class="img-placeholder">5</div>
            </div>
        </div>
    </main>
</body>
</html>
